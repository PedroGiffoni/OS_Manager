services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/os_manager.db
      COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - sqlite-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  sqlite-data: