# Backend de TESTES; PostgreSQL Free temporário, exclusivo para dados fictícios.
# Não contém disco pago, cartão, credenciais ou dados locais.
services:
  - type: web
    name: os-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false # Render Dashboard: use the internal URL of os-manager-test-db (Ohio).
      - key: CLOUD_DEPLOYMENT
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: TRUSTED_ORIGINS
        sync: false
      - key: OS_MANAGER_ALLOW_DEMO_SEED
        sync: false # Enable only for the explicitly authorized fictitious test deployment.
      - key: OS_MANAGER_DEMO_PASSWORD
        sync: false
